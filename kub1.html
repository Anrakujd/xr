<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>WebXR | Kubus ke Jaring-Jaring</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script>
    AFRAME.registerComponent('cube-net', {
      init: function () {
        this.isOpen = false;
        this.faces = this.el.children;

        this.el.addEventListener('click', () => {
          this.isOpen = !this.isOpen;

          const positionsClosed = [
            '0 2 0',   	// merah
            '0 -2 0',  	// hijau
            '-2 0 0',  	// biru
            '2 0 0',   	// kuning
            '0 0 2',  	// toska
            '0 0 -2'   	// ungu
          ];

          const positionsOpen = [
            '0 1 0',  	// merah
            '0 -1 0',	// hijau
            '-1 0 0',	// biru
            '1 0 0',	// kuning
            '0 0 1',	// toska
            '0 0 -1'	// Ungu
          ];

          for (let i = 0; i < this.faces.length; i++) {
            this.faces[i].setAttribute('animation', {
              property: 'position',
              to: this.isOpen ? positionsOpen[i] : positionsClosed[i],
              dur: 100,
              easing: 'easeInOutQuad'
            });
          }
        });
      }
    });
	
	 AFRAME.registerComponent('rotate-y-mouse', {
      schema: { speed: { default: 0.3 } },

      init: function () {
        this.dragging = false;
        this.prevX = 0;

        window.addEventListener('mousedown', e => {
          this.dragging = true;
          this.prevX = e.clientX;
        });

        window.addEventListener('mouseup', () => {
          this.dragging = false;
        });

        window.addEventListener('mousemove', e => {
          if (!this.dragging) return;

          let deltaX = e.clientX - this.prevX;
          this.prevX = e.clientX;

          let rotation = this.el.getAttribute('rotation');
          rotation.y += deltaX * this.data.speed;
          this.el.setAttribute('rotation', rotation);
        });
      }
    });
	
	AFRAME.registerComponent('rotate-x-mouse', {
      schema: { speed: { default: 0.3 } },

      init: function () {
        this.dragging = false;
        this.prevY = 0;

        window.addEventListener('mousedown', e => {
          this.dragging = true;
          this.prevY = e.clientY;
        });

        window.addEventListener('mouseup', () => {
          this.dragging = false;
        });

        window.addEventListener('mousemove', e => {
          if (!this.dragging) return;

          let deltaY = e.clientY - this.prevY;
          this.prevY = e.clientY;

          let rotation = this.el.getAttribute('rotation');
          rotation.x += deltaY * this.data.speed;
          this.el.setAttribute('rotation', rotation);
        });
      }
    });
  </script>
</head>

<body>
  <a-scene cursor="rayOrigin: mouse">
	<a-sky color="#02030f"></a-sky>
	
    <a-entity camera look-controls position="0 4 6">
      <a-cursor fuse="false"
			fuse-timeout="5000"
			color="white"></a-cursor>
    </a-entity>
	
	<a-entity light="type: ambient; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; intensity: 1" position="1 2 1"></a-entity>

    <!-- Kubus / Jaring-jaring -->
    <a-entity cube-net position="0 0 -5"  rotate-x-mouse
	  rotate-y-mouse>
    <a-box id="top" position="0 1 0" rotation="90 0 0"
             width="2" height="2" depth="0.01" color="#FF0000"></a-box>

    <a-box id="bottom" position="0 -1 0" rotation="-90 0 0"
             width="2" height="2" depth="0.01" color="#00FF00"></a-box>

    <a-box id="left" position="-1 0 0" rotation= "0 90 0"
             width="2" height="2" depth="0.01" color="#0000FF"></a-box>

    <a-box id="right" position="1 0 0" rotation="0 -90 0"
             width="2" height="2" depth="0.01" color="#FFFF00"></a-box>

    <a-box id="front" position="0 0 1"
             width="2" height="2" depth="0.01" color="#00FFFF"></a-box>

    <a-box id="back" position="0 0 -1" rotation="0 0 0"
             width="2" height="2" depth="0.01" color="#FF00FF"></a-box>
    </a-entity>

    <!--a-plane rotation="-90 0 0" width="10" height="10" color="#ECECEC"></a-plane-->
    <a-light type="ambient" intensity="0.7"></a-light>
    <a-light type="directional" position="1 3 2"></a-light>

  </a-scene>
</body>
</html>
