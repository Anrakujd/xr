<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>WebXR | Sisi Kubus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script>
    //fungsi javascript untuk klik kubus buka dan klik kubus tutup
	AFRAME.registerComponent('cube-net', {
      init: function () {
        this.isOpen = false;
        this.faces = this.el.children;

        this.el.addEventListener('click', () => {
          this.isOpen = !this.isOpen;

          const positionsClosed = [
            '0 2 0',   	// sisi merah
            '0 -2 0',  	// sisi hijau
            '-2 0 0',  	// sisi biru
            '2 0 0',   	// sisi kuning
            '0 0 2',  	// sisi toska
            '0 0 -2'   	// sisi ungu
          ];

          const positionsOpen = [
            '0 1 0',  	// sisi merah
            '0 -1 0',	// sisi hijau
            '-1 0 0',	// sisi biru
            '1 0 0',	// sisi kuning
            '0 0 1',	// sisi toska
            '0 0 -1'	// sisi Ungu
          ];

          for (let i = 0; i < this.faces.length; i++) {
            this.faces[i].setAttribute('animation', {
              property: 'position',
              to: this.isOpen ? positionsOpen[i] : positionsClosed[i],
              dur: 100,
              easing: 'easeInOutQuad'
            });
          }
        });
      }
    });
	
	//fungsi javascript untuk memutar pada sumbu Y dengan mouse
	 AFRAME.registerComponent('rotate-y-mouse', {
      schema: { speed: { default: 0.003 } },

      init: function () {
        this.dragging = false;
        this.prevX = 0;

        window.addEventListener('mousedown', e => {
          this.dragging = true;
          this.prevX = e.clientX;
        });

        window.addEventListener('mouseup', () => {
          this.dragging = false;
        });

        window.addEventListener('mousemove', e => {
          if (!this.dragging) return;

          //let deltaX = e.clientX - this.prevX;
          //this.prevX = e.clientX;
		  
		  let deltaX = e.clientX;
          this.prevX = e.clientX;

          let rotation = this.el.getAttribute('rotation');
          rotation.y += deltaX * this.data.speed;
          this.el.setAttribute('rotation', rotation);
        });
      }
    });
	
	//fungsi javascript untuk memutar pada sumbu X dengan mouse
	AFRAME.registerComponent('rotate-x-mouse', {
      schema: { speed: { default: 0.003 } },

      init: function () {
        this.dragging = false;
        this.prevY = 0;

        window.addEventListener('mousedown', e => {
          this.dragging = true;
          this.prevY = e.clientY;
        });

        window.addEventListener('mouseup', () => {
          this.dragging = false;
        });

        window.addEventListener('mousemove', e => {
          if (!this.dragging) return;

          //let deltaY = e.clientY - this.prevY;
          //this.prevY = e.clientY;
		  
		  let deltaY = e.clientY;
          this.prevY = e.clientY;

          let rotation = this.el.getAttribute('rotation');
          rotation.x += deltaY * this.data.speed;
          this.el.setAttribute('rotation', rotation);
        });
      }
    });
	//rotate isometri
	AFRAME.registerComponent('drag-rotate', {
      init: function () {
        let lastX = null;
        let lastY = null;

        this.el.sceneEl.addEventListener('mousedown', e => {
          lastX = e.clientX;
          lastY = e.clientY;
        });

        this.el.sceneEl.addEventListener('mousemove', e => {
          if (lastX !== null) {
            const dx = e.clientX - lastX;
            const dy = e.clientY - lastY;
            const rot = this.el.getAttribute('rotation');
            this.el.setAttribute('rotation', {
              x: rot.x + dy * 0.3,
              y: rot.y + dx * 0.3,
              z: rot.z
            });
            lastX = e.clientX;
            lastY = e.clientY;
          }
        });

        window.addEventListener('mouseup', () => {
          lastX = null;
          lastY = null;
        });
      }
    });
	
	function back(){
		window.location.href = "kubus_depan.html";
	}
	function next(){
		window.location.href = "kub2.html";
	}
	function enterXR() {
      const scene = document.querySelector("a-scene");
      if (scene.hasLoaded) {
        scene.enterVR(); // AR / VR tergantung device
      }
    }
	
  </script>

<link rel="stylesheet" href="style.css">
</head>

<body>
<!-- Header -->
<header>
	<h1>Kubus</h1>
    <h2>Kubus memiliki 6 buah sisi berbentuk persegi</h2>
	<h2>"Arahkan cursor ke sisi dan klik"</h2>
</header>

 <!-- MENU -->
 <section class="menu">
    <button onclick="enterXR()">Masuk ke XR Mode</button>
    <button onclick="back()">Sebelumnya</button>
	<!--button onclick="">Lessons</button>
    <button onclick="">Quiz</button-->
	<button onclick="next()">selanjutnya</button>
 </section>

<!-- WebXr cube -->
 <!--a-scene cursor="rayOrigin: mouse">
	<!--a-sky color="#02030f"></a-sky-->
<a-scene
    embedded
    vr-mode-ui="enabled: true"
    renderer="antialias: true"
    webxr="optionalFeatures: hit-test, local-floor"
  >		
    <a-entity camera look-controls position="0 4 6">
      <a-cursor fuse="true"
			fuse-timeout="1500"
			color="white"></a-cursor>
    </a-entity>
	
	<a-entity light="type: ambient; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; intensity: 1" position="1 2 1"></a-entity>
	
    <!-- Kubus / Jaring-jaring -->
    <a-entity cube-net position="0 4 0" rotate-x-mouse rotate-y-mouse >
    <a-box id="top" position="0 1 0" rotation="90 0 0"
             width="2" height="2" depth="0.01" color="#FF0000"></a-box>

    <a-box id="bottom" position="0 -1 0" rotation="-90 0 0"
             width="2" height="2" depth="0.01" color="#00FF00"></a-box>

    <a-box id="left" position="-1 0 0" rotation= "0 90 0"
             width="2" height="2" depth="0.01" color="#0000FF"></a-box>

    <a-box id="right" position="1 0 0" rotation="0 -90 0"
             width="2" height="2" depth="0.01" color="#FFFF00"></a-box>

    <a-box id="front" position="0 0 1"
             width="2" height="2" depth="0.01" color="#00FFFF"></a-box>

    <a-box id="back" position="0 0 -1" rotation="0 0 0"
             width="2" height="2" depth="0.01" color="#FF00FF"></a-box>
    </a-entity>

    <!--a-plane rotation="-90 0 0" width="10" height="10" color="#ECECEC"></a-plane-->
    <a-light type="ambient" intensity="0.7"></a-light>
    <a-light type="directional" position="1 3 2"></a-light>

	<!--section class="menu">
    <button onclick="back()">Sebelumnya</button>
	</section-->
 </a-scene>
	
</body>
</html>
