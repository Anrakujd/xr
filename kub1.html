<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>WebXR | Animasi Rusuk Kubus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script>
    //fungsi javascript untuk klik kubus buka dan klik kubus tutup
	AFRAME.registerComponent('cube-net', {
  init: function () {
    this.isOpen = false;
    this.faces = this.el.children;
  },

  toggle: function () {
    this.isOpen = !this.isOpen;

    const closed = [
			'0 2 0',   	// sisi merah
            '0 -2 0',  	// sisi hijau
            '-2 0 0',  	// sisi biru
            '2 0 0',   	// sisi kuning
            '0 0 2',  	// sisi toska
            '0 0 -2'   	// sisi ungu
    ];

    const open = [
			'0 1 0',  	// sisi merah
            '0 -1 0',	// sisi hijau
            '-1 0 0',	// sisi biru
            '1 0 0',	// sisi kuning
            '0 0 1',	// sisi toska
            '0 0 -1'	// sisi Ungu
    ];

    for (let i = 0; i < this.faces.length; i++) {
      this.faces[i].setAttribute('animation__openclose', {
        property: 'position',
        to: this.isOpen ? open[i] : closed[i],
        dur: 400,
        easing: 'easeInOutQuad'
      });
    }
  }
});
	
	function enterXR() {
      const scene = document.querySelector("a-scene");
      if (scene.hasLoaded) {
        scene.enterVR(); // AR / VR tergantung device
      }
    }

    function back() {
      window.location.href = "kub2.html";
    }
	
	function next(){
		window.location.href = "index.html";
	}
	function home(){
		window.location.href = "index.html";
	}
	
AFRAME.registerComponent('rotate-on-fuse', {
  schema: {
	axis: { type: 'string' },
    target: { type: 'selector' },
    speed: { type: 'number', default: 30 } // derajat per detik
  },

  init: function () {
    this.rotating = false;

    this.el.addEventListener('mouseenter', () => {
      this.rotating = true;
    });

    this.el.addEventListener('mouseleave', () => {
      this.rotating = false;
    });
  },

  tick: function (time, delta) {
    if (!this.rotating) return;

    const obj = this.data.target;
    const rot = obj.getAttribute('rotation');
    const step = this.data.speed * (delta / 1000);

    if (this.data.axis === 'x') rot.x += step;
    if (this.data.axis === 'y') rot.y += step;
    if (this.data.axis === 'z') rot.z += step;

    obj.setAttribute('rotation', rot);
  }
});

AFRAME.registerComponent('toggle-cube-fuse', {
  schema: {
    target: { type: 'selector' },
    timeout: { type: 'number', default: 100 } // ms
  },

  init: function () {
    this.fuseTimer = null;

    this.el.addEventListener('mouseenter', () => {
      this.fuseTimer = setTimeout(() => {
        const targetEl = this.data.target;
        if (!targetEl) return;

        const cube = targetEl.components['cube-net'];
        if (!cube) return;

        cube.toggle(); // OPEN / CLOSE
      }, this.data.timeout);
    });

    this.el.addEventListener('mouseleave', () => {
      if (this.fuseTimer) {
        clearTimeout(this.fuseTimer);
        this.fuseTimer = null;
      }
    });
  }
});
</script>


</script>

  <!-- Style -->
  <link rel="stylesheet" href="style.css">
  
</head>

<body>
<!-- HEADER >
  <header class="header">
    <h2>Kubus memiliki 12 buah rusuk yang sama panjang</h2>
  </header-->

<a-scene
    embedded
    vr-mode-ui="enabled: true"
    renderer="antialias: true"
    webxr="optionalFeatures: hit-test, local-floor"
  >	
    <a-entity camera look-controls position="0 4 6">
		<a-cursor 
			fuse="true"
			fuse-timeout="1000"
			raycaster="objects: .clickable"
			color="white">
		</a-cursor>
    </a-entity>
	
	<a-entity light="type: ambient; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; intensity: 1" position="1 2 1"></a-entity>
	<!-- Navigasi -->
	<a-assets>
		<img id="img-back" src="back icon.png">
		<img id="img-home" src="home icon.png">
		<img id="img-next" src="next icon.png">
		<img id="img-openclose" src="openclose.png">
	</a-assets>
		
	<a-plane
		src="#img-back"
		position="-1 6 1"
		width="1"
		height="0.75"
		class="clickable"
		transparent="true"
		onclick="back()">
	</a-plane>
	
	<a-plane
		src="#img-home"
		position="0 6 1"
		width="1"
		height="0.75"
		class="clickable"
		transparent="true"
		onclick="home()">
	</a-plane>
	
	<a-plane
		src="#img-next"
		position="1 6 1"
		width="1"
		height="0.75"
		class="clickable"
		transparent="true"
		onclick="next()">
	</a-plane>
	
	<!-- XR Controller -->
	<a-assets>
		<img id="img-rx" src="RX.png">
		<img id="img-ry" src="RY.png">
		<img id="img-rz" src="RZ.png">
	</a-assets>
	
	<a-plane
		src="#img-rx"
		position="0.35 -0.85 -3"
		width="1"
		height="0.65"
		class="clickable"
		transparent="true"
		rotate-on-fuse="axis: x; target: #cube-net; speed: 25">
	</a-plane>
	
	<a-plane
		src="#img-ry"
		position="-0.5 0 -3"
		width="0.65"
		height="1"
		class="clickable"
		transparent="true"
		rotate-on-fuse="axis: y; target: #cube-net; speed: 25">
	</a-plane>
	
	<a-plane
		src="#img-rz"
		position="0.35 0 -3"
		width="1"
		height="1"
		class="clickable"
		transparent="true"
		rotate-on-fuse="axis: z; target: #cube-net; speed: 25">
	</a-plane>
	
	<a-plane
		src="#img-openclose"
		position="-0.5 -0.85 -3"
		width="0.65"
		height="0.65"
		class="clickable"
		transparent="true"
		toggle-cube-fuse="target: #cube-net; timeout: 100">
	</a-plane>
   
	<a-entity id="cube-net" cube-net position="0 4 -5">
		<a-box id="top" position="0 1 0" rotation="90 0 0"
             width="2" height="2" depth="0.01" color="#FF0000"></a-box>

		<a-box id="bottom" position="0 -1 0" rotation="-90 0 0"
             width="2" height="2" depth="0.01" color="#00FF00"></a-box>

		<a-box id="left" position="-1 0 0" rotation= "0 90 0"
             width="2" height="2" depth="0.01" color="#0000FF"></a-box>

		<a-box id="right" position="1 0 0" rotation="0 -90 0"
             width="2" height="2" depth="0.01" color="#FFFF00"></a-box>

		<a-box id="front" position="0 0 1"
             width="2" height="2" depth="0.01" color="#00FFFF"></a-box>

		<a-box id="back" position="0 0 -1" rotation="0 0 0"
             width="2" height="2" depth="0.01" color="#FF00FF"></a-box>
    </a-entity>

    <a-light type="ambient" intensity="0.7"></a-light>
    <a-light type="directional" position="1 3 2"></a-light>

  </a-scene>
</body>
</html>
