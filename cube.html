<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>GXR | KUBUS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- A-Frame (WebXR) -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script>
	AFRAME.registerComponent('custom-prisma', {
		init: function () {
		const shape = new THREE.Shape();
		shape.moveTo(0, 0);
		shape.lineTo(1, 0);
		shape.lineTo(0.5, 0.8);
		shape.lineTo(0, 0);
		const geometry = new THREE.ExtrudeGeometry(shape, {
			depth: 1,
			bevelEnabled: false
    });
		const material = new THREE.MeshStandardMaterial({
		color: 0x00ff00,
		metalness: 0.2,
		roughness: 0.4
    });
		const mesh = new THREE.Mesh(geometry, material);
		//mesh.rotation.x = -Math.PI;
		mesh.scale.set(0.8, 0.8, 0.8);

		this.el.setObject3D('mesh', mesh);
	}
	});
	</script>

  <!-- Style -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
 
  <!-- WEBXR SCENE -->
  <a-scene
    embedded
    vr-mode-ui="enabled: true"
    renderer="antialias: true"
    webxr="optionalFeatures: hit-test, local-floor"
  >
	<!-- Kamera + cursor -->
	<a-entity camera look-controls>
		<a-cursor 
			fuse="true"
			fuse-timeout="500"
			color="red">
		</a-cursor>
	</a-entity>

    <!-- CAMERA -->
    <a-entity camera look-controls position="0 0 0"></a-entity>

    <!-- LIGHT -->
    <a-entity light="type: ambient; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; intensity: 1" position="1 2 1"></a-entity>

    <a-grid
      position="0 0 0"
      rotation="0 0 0"
      color="#00ffff"
    ></a-grid>
	<a-sky color="#02030f"></a-sky>
	
    <!-- GEOMETRY OBJECT -->
	<a-text
      value="Kubus Verse"
      position="0 3 -4"
      align="center"
      color="#00ffff"
      width="6"
    ></a-text>
	
	<!-- Kubus1-->
    <a-box
		id="kubus1"
		position="0 1 -4"
		depth="1"
		height="1"
		width="1"
		color="#005000"
		material="emissive: #005000; emissiveIntensity: 0.5"
		animation="property: rotation; to: 360 360 360; loop: true; dur: 8000"
	></a-box>
    <!-- LABEL kubus-->
    <a-text
      value="Geometri Kubus"
      position="0 2 -4"
      align="center"
      color="#00ffff"
      width="4"
    ></a-text>
	
	<!-- Kubus2-->
    <a-entity id="kubus2" position="-4 -1.5 -5">
		<a-entity id="kubus2" rotation="0 0 0" >
			<a-cylinder
				id="kubus2"
				position= "-1 0 -0.5"
				radius ="0.01"
				height= "1.5"
				color="#FFFFFF"
				material="emissive: #ffffff; emissiveIntensity: 0.5">
			</a-cylinder>
			<a-text
				value="Y"
				position="-1 1 -0.5"
				align="center"
				color="#00ffff"
				width="5">
			</a-text>
			
			<a-cylinder
				id="kubus2"
				rotation="0 0 90"
				position= "0 -0.5 -0.5"
				radius ="0.01"
				height= "2.5"
				color="#FFFFFF"
				material="emissive: #ffffff; emissiveIntensity: 0.5">
			</a-cylinder>
			<a-text
				value="X"
				position="1.5 -0.5 0"
				align="center"
				color="#00ffff"
				width="5">
			</a-text>
			
			<a-cylinder
				id="kubus2"
				rotation="0 -90 90"
				position= "-1 -0.5 -1"
				radius ="0.01"
				height= "1.5"
				color="#FFFFFF"
				material="emissive: #ffffff; emissiveIntensity: 0.5">
			</a-cylinder>
			
			<a-text
				value="Z"
				position="-1 -0.5 -2"
				align="center"
				color="#00ffff"
				width="5">
			</a-text>
			
		</a-entity>
	</a-entity>
    <!-- LABEL kubus-->
    <a-text
      value="Sistem Koordinat Ruang"
	  id="kubus2"
      position="-3 -2 -5"
      align="center"
      color="#00FFFF"
      width="4"
    ></a-text>
	
	<!-- Kubus3-->
    <a-entity id="kubus3" position="6 -4 -5" onclick="showDreben()">
		<a-box
			id="D1"
			position="0 1.5 -4"
			depth="1"
			height="1"
			width="1"
			color="#ff0000"
			material="emissive: #ff0000; emissiveIntensity: 0.5">
		</a-box>
		<a-box
			id="D2"
			position="1 1.5 -4"
			depth="1"
			height="1"
			width="1"
			color="#00ff00"
			material="emissive: #00ff00; emissiveIntensity: 0.5">
		</a-box>
		<a-box
			id="D3"
			position="0 2.5 -4"
			depth="1"
			height="1"
			width="1"
			color="#0000ff"
			material="emissive: #0000ff; emissiveIntensity: 0.5">
		</a-box>
		<a-box
			id="D4"
			position="0 1.5 -3"
			depth="1"
			height="1"
			width="1"
			color="#ff00ff"
			material="emissive: #ff00ff; emissiveIntensity: 0.5">
		</a-box>	
	</a-entity>
    <!-- LABEL kubus-->
    <a-text
      value="KUBARA"
      position="3 -2 -4"
      align="center"
      color="#00FFFF"
      width="4"
    ></a-text>

	<a-assets>
    <img id="img-home" src="portal.png">
	<img id="img-frame1" src="img/glow1.png">
	</a-assets>
	
	<a-plane 
    src="#img-frame1"
    position="-4 2 -5"
    width="2"
    height="2"
    class="menu"
	color="white"
	transparent="true">
	</a-plane>
	
	<a-plane 
    src="#img-home"
    position="-4 2 -5"
    width="1"
    height="1"
    class="menu"
	transparent="true"
	animation="property: rotation; to: 0 0 360; loop: true; dur: 8000"
    onclick="showAnimasi()">
	</a-plane>
	
	<a-text
      value="Kembali ke"
      position="-3.2 2.4 -4"
      align="center"
      color="#00FFFF"
      width="4"
    ></a-text>
	<a-text
      value="Prodi PTIK Verse"
      position="-3.2 2.2 -4"
      align="center"
      color="#00FFFF"
      width="4"
    ></a-text>
 
</a-entity>

  </a-scene>

   <!-- SCRIPT -->
  <script>
    function showAnimasi() {
      window.location.href = "index.html";
    }
	
	function enterXR() {
      const scene = document.querySelector("a-scene");
      if (scene.hasLoaded) {
        scene.enterVR(); // AR / VR tergantung device
      }
    }

    function resetScene() {
      window.location.href = "index.html";
    }
	
	function halaman_about(){
		window.location.href = "about.html";
	}
	
	document.querySelector('#kubus1')
    .addEventListener('click', function () {
      window.location.href = 'kubus_depan.html';
    });
	
	document.querySelector('#kubus2')
    .addEventListener('click', function () {
      window.location.href = 'gt.html';
    });
	
	document.querySelector('#kubus3')
    .addEventListener('click', function () {
      window.location.href = 'herzberger.html';
    });
  </script>

</body>
</html>
