<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>GXR | Sistem Koordinat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- A-Frame (WebXR) -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script>
	AFRAME.registerComponent('rotate-on-fuse', {
  schema: {
    axis: { type: 'string', default: 'y' },
    target: { type: 'selector' },
    duration: { type: 'number', default: 300 } // durasi animasi ms
  },

  init: function () {

    this.el.addEventListener('mouseenter', () => {

      const obj = this.data.target;
      if (!obj) return;

      let rot = obj.getAttribute('rotation');

      // Hitung rotasi baru +90 derajat
      let newRot = { x: rot.x, y: rot.y, z: rot.z };

      if (this.data.axis === 'x') newRot.x += 90;
      if (this.data.axis === 'y') newRot.y += 90;
      if (this.data.axis === 'z') newRot.z += 90;

      // Gunakan animasi supaya smooth
      obj.setAttribute('animation', {
        property: 'rotation',
        to: `${newRot.x} ${newRot.y} ${newRot.z}`,
        dur: this.data.duration,
        easing: 'easeInOutQuad'
      });

    });

  }
});
	</script>

  <!-- Style -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- WEBXR SCENE -->
  <a-scene
    embedded
    vr-mode-ui="enabled: true"
    renderer="antialias: true"
    webxr="optionalFeatures: hit-test, local-floor"
  >
	<!-- Kamera + cursor -->
	<a-entity camera look-controls position="0 0 0">
		<a-cursor 
			fuse="true"
			fuse-timeout="500"
			color="red">
		</a-cursor>
    </a-entity>

   
    <!-- LIGHT -->
    <a-entity light="type: ambient; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; intensity: 1" position="1 2 1"></a-entity>

    
    <!-- GEOMETRY OBJECT -->
	<a-text
      value="Sistem Koordinat Ruang"
      position="0 3 -4"
      align="center"
      color="#00ffff"
      width="6"
    ></a-text>
	<a-text
      value="Rotasi Sistem Koordinat Ruang Cartesian"
      position="0 2.5 -4"
      align="center"
      color="#00ffff"
      width="4"
    ></a-text>
	
	<!-- XR Controller -->
	<a-assets>
		<img id="img-rx" src="RX.png">
		<img id="img-ry" src="RY.png">
		<img id="img-rz" src="RZ.png">
	</a-assets>
	
	<a-plane
		src="#img-rx"
		position="0 -2 -5"
		width="1"
		height="0.65"
		class="clickable"
		transparent="true"
		rotate-on-fuse="axis: x; target: #zwei; speed: 0.01">
	</a-plane>
	
	<a-text
		value="Rotasi Sumbu X"
		position="0 -2.5 -5"
		align="center"
		color="#00ffff"
		width="3">
	</a-text>
	
	<a-plane
		src="#img-ry"
		position="-2.5 0 -5"
		width="0.65"
		height="1"
		class="clickable"
		transparent="true"
		rotate-on-fuse="axis: y; target: #zwei; speed: 0.01">
	</a-plane>
	
	<a-text
		value="Rotasi Sumbu Y"
		position="-2.5 -0.65 -5"
		align="center"
		color="#00ffff"
		width="3">
	</a-text>
	
	<a-plane
		src="#img-rz"
		position="2.5 0 -5"
		width="1"
		height="1"
		class="clickable"
		transparent="true"
		rotate-on-fuse="axis: z; target: #zwei; speed: 0.01">
	</a-plane>
	
	<a-text
		value="Rotasi Sumbu Z"
		position="2.5 -0.65 -5"
		align="center"
		color="#00ffff"
		width="3">
	</a-text>
	
	<!-- Koordinart Ruang-->
	<a-entity position="0 0 -5">
		<a-entity id="zwei" rotation="0 0 0">
			<a-cylinder
				id="Y"
				position= "-1 0 -0.5"
				radius ="0.01"
				height= "1.5"
				color="#FFFFFF"
				material="emissive: #ffffff; emissiveIntensity: 0.5">
			</a-cylinder>
			<a-text
				value="Y"
				position="-1 1 -0.5"
				align="center"
				color="#00ffff"
				width="5">
			</a-text>
			
			<a-cylinder
				id="X"
				rotation="0 0 90"
				position= "0 -0.5 -0.5"
				radius ="0.01"
				height= "2.5"
				color="#FFFFFF"
				material="emissive: #ffffff; emissiveIntensity: 0.5">
			</a-cylinder>
			<a-text
				value="X"
				position="1.5 -0.5 0"
				align="center"
				color="#00ffff"
				width="5">
			</a-text>
			
			<a-cylinder
				id="Z"
				rotation="0 -90 90"
				position= "-1 -0.5 -1"
				radius ="0.01"
				height= "1.5"
				color="#FFFFFF"
				material="emissive: #ffffff; emissiveIntensity: 0.5">
			</a-cylinder>
			
			<a-text
				value="Z"
				position="-1 -0.5 -2"
				align="center"
				color="#00ffff"
				width="5">
			</a-text>
			
		</a-entity>
	</a-entity>
	
		
	<!-- kontrol navigasi-->
	<a-assets>
    <img id="img-home" src="portal.png">
	<img id="img-frame1" src="img/glow1.png">
	</a-assets>
	
	<a-plane 
    src="#img-frame1"
    position="-4 3 -5"
    width="2"
    height="2"
    class="menu"
	color="white"
	transparent="true">
	</a-plane>
	
	<a-plane 
    src="#img-home"
    position="-4 3 -5"
    width="1"
    height="1"
    class="menu"
	transparent="true"
	animation="property: rotation; to: 0 0 360; loop: true; dur: 8000"
    onclick="showAnimasi()">
	</a-plane>
	
	<a-text
      value="Kembali ke"
      position="-3.2 3.2 -4"
      align="center"
      color="#00FFFF"
      width="4"
    ></a-text>
	<a-text
      value="Herzberger Quader"
      position="-3.2 3 -4"
      align="center"
      color="#00FFFF"
      width="4"
    ></a-text>
  
 </a-scene>

<script>
    function showAnimasi() {
      window.location.href = "cube.html";
    }
	
	function enterXR() {
      const scene = document.querySelector("a-scene");
      if (scene.hasLoaded) {
        scene.enterVR(); // AR / VR tergantung device
      }
    }

    /*	
	document.querySelector('#kubus3')
    .addEventListener('click', function () {
      window.location.href = 'index.html';
    });*/
	
</script>

</body>
</html>
